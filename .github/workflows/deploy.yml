
name: Deploy valimai.net to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Verify project files
      - name: Check project files
        run: |
          ls -la
          test -f package.json || (echo "package.json not found" && exit 1)

      # 4. Install dependencies
      - name: Install dependencies
        run: |
          npm cache clean --force
          npm install --no-audit --no-fund --legacy-peer-deps

      # 5. Build React application
      - name: Build React app
        run: npm run build

      # 6. Verify build output
      - name: Check build output
        run: |
          test -d dist || (echo "dist folder not found" && exit 1)
          ls -la dist

      # 7. Setup SSH
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # 8. Test SSH connection
      - name: Test SSH connection
        run: |
          ssh -4 \
            -p "${{ secrets.SSH_PORT }}" \
            -o ConnectTimeout=30 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=3 \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            "echo 'SSH connection successful'"

      # 9. Deploy to Hostinger
      - name: Deploy valimai.net
        run: |
          rsync -avz --delete \
            -e "ssh -4 \
              -p ${{ secrets.SSH_PORT }} \
              -o ConnectTimeout=30 \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ServerAliveInterval=60 \
              -o ServerAliveCountMax=3" \
            dist/ \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}"
