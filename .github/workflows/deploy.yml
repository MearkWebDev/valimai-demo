
name: Deploy valimai.net to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # 4. Build React application
      - name: Build React app
        run: npm run build

      # 5. Check build output
      - name: Check build output
        run: |
          echo "Checking generated build files..."

          if [ -d ".output" ]; then
            echo "Build output found: .output"
            ls -la .output

          elif [ -d "dist" ]; then
            echo "Build output found: dist"
            ls -la dist

          else
            echo "Error: Build output not found."
            exit 1
          fi

      # 6. Setup SSH
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # 7. Test SSH connection
      - name: Test SSH connection
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" \
            -o ConnectTimeout=30 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            "echo 'SSH connection successful'"

      # 8. Deploy to Hostinger
      - name: Deploy valimai.net
        run: |
          if [ -d ".output" ]; then
            DEPLOY_SOURCE=".output/"
          elif [ -d "dist" ]; then
            DEPLOY_SOURCE="dist/"
          else
            echo "Error: No build output found."
            exit 1
          fi

          echo "Deploying $DEPLOY_SOURCE"

          rsync -avz --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }} \
              -o ConnectTimeout=30 \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null" \
            "$DEPLOY_SOURCE" \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}"
